    $("#o_photo_del").onclick = () => { newPhoto = null; dropPhoto = true; const im = $("#o_photo_img"); im.removeAttribute("src"); im.style.visibility = "hidden"; $("#o_photo_del").hidden = true; $("#o_photo_pick").textContent = "Add photo"; };
    m.querySelector("[data-x]").onclick = close;
    $("#osave").onclick = async () => { read();
      if (isSpecial(o)){ if (!o.custom.desc){ toast("Describe what the customer wants"); $("#o_desc").focus(); return; }
        if (newPhoto){ try{ o.custom.photo = await savePhoto(null, newPhoto); }catch(e){ toast(e.message); return; } } else if (dropPhoto) o.custom.photo = null; }
      else if (!o.items.length){ toast("Add at least one item"); return; } S.settings.lastChannel = o.channel; if (isNew){ o.feePct = n(S.settings.feePct); o.packaging = n(S.settings.packaging); S.orders.unshift(o); } else S.orders[S.orders.findIndex(x=>x.id===o.id)] = o; persist("orders","settings"); close(); render(); toast("Order saved"); };
    if (!isNew) $("#odel").onclick = () => { close(); const cur0 = S.orders.find(x=>x.id===o.id); trash("orders", cur0); render(); };
  });
}
function setOrderStatus(id, status){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const was = o.status === "delivered", now = status === "delivered";
  o.status = status; if (now && !was){ o.deliveredAt = today(); o.deliveredTs = new Date().toISOString(); }
  persist("orders"); render(); toast(now ? "Delivered · stock updated" : "Status updated");
}

function noteForm(kind, x){
  const isNew = !x; x = x ? {...x} : {id:uid(), title:"", body:"", tag:"", date:today()};
  modal(isNew?(kind==="ideas"?"New idea":"New lesson"):"Edit", `<div class="form">
    <label class="f full">Title<input id="n_t" value="${esc(x.title)}"></label>
    <label class="f full">Details<textarea id="n_b">${esc(x.body)}</textarea></label>
    <label class="f">Tag<input id="n_tag" value="${esc(x.tag)}" placeholder="${kind==="ideas"?"e.g. Ramadan":"e.g. supports"}"></label>
  </div><div class="foot">${isNew?"":`<button class="btn danger" id="ndel" style="margin-right:auto">Delete</button>`}<button class="btn" data-x>Cancel</button><button class="btn primary" id="nsave">Save</button></div>`, m => {
    m.querySelector("[data-x]").onclick = close;
    $("#nsave").onclick = () => { Object.assign(x,{title:$("#n_t").value.trim(), body:$("#n_b").value, tag:$("#n_tag").value.trim()}); if (!x.title) return; if (isNew) S[kind].unshift(x); else S[kind][S[kind].findIndex(y=>y.id===x.id)] = x; persist(kind); close(); render(); };
    if (!isNew) $("#ndel").onclick = () => { close(); trash(kind, S[kind].find(y=>y.id===x.id)); render(); };
  });
}

/* ---------- import / export ---------- */
function applyBackup(d, label){
  if (!d || !Array.isArray(d.products) || !Array.isArray(d.spools)) throw new Error("bad");
  confirmBox(`Replace the data on this phone with ${label}? (${d.products.length} products, ${d.spools.length} spools, ${(d.prints||[]).length} prints)`, "Import", () => {
    const b = blank(); KEYS.forEach(k => { if (d[k] !== undefined) b[k] = d[k]; });
    b.settings = Object.assign(blank().settings, d.settings||{});
    S = b; ensureLedger(); recompute(); persist(...KEYS); render(); toast("Backup imported");
  });
}
function importFile(){
  modal("Import backup", `<p class="meta">Choose a WAV backup file from Files, or paste the backup text you copied from the Claude page (Settings → Export backup → Copy).</p>
    <div class="row" style="margin-bottom:12px"><button class="btn primary" id="imFile">Choose file</button></div>
    <label class="f">Or paste backup text<textarea id="imText" placeholder='{"products": …}' style="min-height:140px;font-family:var(--f-mono);font-size:12px"></textarea></label>
    <div class="foot"><button class="btn" data-x>Cancel</button><button class="btn primary" id="imPaste">Import pasted text</button></div>`, m => {
    m.querySelector("[data-x]").onclick = close;
    $("#imFile").onclick = () => { close(); pickFile(); };
    $("#imPaste").onclick = () => { try{ const d = JSON.parse($("#imText").value); close(); applyBackup(d, "the pasted backup"); }catch(e){ toast("That text isn't a complete WAV backup. Copy all of it and try again."); } };
  });
}
function pickFile(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try{
      applyBackup(JSON.parse(await f.text()), f.name);
    }catch(e){ toast("That file isn't a WAV backup. Choose the .json file exported from the site."); }
  };
  inp.click();
}
async function exportFile(){
  const name = `${(S.settings.workspace||"wav").toLowerCase()}-${today()}.json`;
  const data = JSON.stringify(S, null, 2);
  const mark = () => { S.settings.lastBackup = new Date().toISOString(); persist("settings"); render(); };
  try{
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); mark(); toast("Backup shared"); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  try{
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); mark(); toast("Backup downloaded"); return;
  }catch(e){}
  modal("Backup", `<p class="meta">Copy this text and save it as <b>${esc(name)}</b>.</p><textarea id="bk" readonly style="min-height:220px;font-family:var(--f-mono);font-size:12px">${esc(data)}</textarea><div class="foot"><button class="btn" data-x>Close</button><button class="btn primary" id="cp">Copy</button></div>`, m => {
    m.querySelector("[data-x]").onclick = close;
    $("#cp").onclick = () => { const t=$("#bk"); navigator.clipboard.writeText(t.value).then(()=>toast("Copied"), ()=>{ t.select(); toast("Selected, press Ctrl+C"); }); };
  });
}

/* ---------- bindings ---------- */
function bind(){
  const M = $("#main");
  M.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  M.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ({
    newProduct:()=>productForm(), newPrint:()=>printForm(), newSpool:()=>spoolForm(), newOrder:()=>orderForm(),
    import:importFile, export:exportFile,
    syncNow:()=>syncNow(true), shareView:shareInviteForm, history:historyForm,
    useInvite:()=>useInvite($("#inv_text").value),
    copyInvite:()=>{ let l=""; try{ l=localStorage.getItem("wav-invite")||""; }catch(e){} if (l) copyText(l, "Invite link copied. Paste it in the app after adding it to your Home Screen."); }, syncOff:()=>confirmBox("Turn off sync on this device? Your data stays here, and other devices keep syncing.","Turn off",disconnectSync),
    syncConnect:()=>{ const o=$("#sy_owner").value, r=$("#sy_repo").value, t=$("#sy_token").value; if (!o.trim()||!r.trim()||!t.trim()) return toast("Fill in account, repository and token"); toast("Connecting…"); connectSync(o, r, t, $("#sy_ro").checked); },
    emptyTrash:()=>confirmBox("Permanently delete everything in the trash? This can't be undone.","Empty trash",()=>{ S.trash=[]; persist("trash"); render(); }),
    saveSettings:()=>{ Object.assign(S.settings,{workspace:$("#s_ws").value.trim()||"WAV", currency:$("#s_cur").value.trim()||"SAR", hour:n($("#s_hour").value), energy:n($("#s_energy").value), wear:n($("#s_wear").value), failAllow:$("#s_fail").checked, feePct:n($("#s_fee").value), packaging:n($("#s_pack").value), targetMargin:n($("#s_tm").value)}); persist("settings"); render(); toast("Settings saved"); }
  })[b.dataset.act]?.());
  M.querySelectorAll("[data-editp]").forEach(b => b.onclick = () => productForm(product(b.dataset.editp)));
  M.querySelectorAll("[data-viewp]").forEach(el => el.onclick = () => productView(el.dataset.viewp));
  M.querySelectorAll("[data-print]").forEach(b => b.onclick = () => printForm(b.dataset.print, b.dataset.q));
  M.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { const p = product(b.dataset.step); setStock(p.id, n(p.stock)+n(b.dataset.d), "Manual adjustment"); });
  M.querySelectorAll("[data-count]").forEach(i => i.onchange = () => setStock(i.dataset.count, i.value, "Count correction"));
  M.querySelectorAll("[data-adjp]").forEach(b => b.onclick = () => adjustStockForm(product(b.dataset.adjp)));
  M.querySelectorAll("[data-sell]").forEach(b => b.onclick = () => sellForm(product(b.dataset.sell)));
  M.querySelectorAll("[data-pc]").forEach(b => b.onclick = () => { filter.pc = b.dataset.pc; render(); });
  M.querySelectorAll("[data-rp]").forEach(b => b.onclick = () => { filter.rp = b.dataset.rp; render(); });
  M.querySelectorAll("[data-paid]").forEach(b => b.onclick = () => { const o = S.orders.find(x=>x.id===b.dataset.paid); o.paid = !o.paid; persist("orders"); render(); toast(o.paid?"Marked paid":"Marked unpaid"); });
  M.querySelectorAll("[data-edits]").forEach(b => b.onclick = () => spoolForm(spool(b.dataset.edits)));
  M.querySelectorAll("[data-adj]").forEach(b => b.onclick = () => adjustForm(spool(b.dataset.adj)));
  M.querySelectorAll("[data-edito]").forEach(b => b.onclick = () => orderForm(S.orders.find(o=>o.id===b.dataset.edito)));
  M.querySelectorAll("[data-ostatus]").forEach(s => s.onchange = () => setOrderStatus(s.dataset.ostatus, s.value));
  M.querySelectorAll("[data-note]").forEach(b => b.onclick = () => noteForm(b.dataset.note));
  M.querySelectorAll("[data-editn]").forEach(b => { const [k,id] = b.dataset.editn.split(":"); b.onclick = () => noteForm(k, S[k].find(x=>x.id===id)); });
  M.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => restore(S.trash.find(t=>t.id===b.dataset.restore)));
  M.querySelectorAll("[data-prf]").forEach(b => b.onclick = () => { filter.pr = b.dataset.prf; render(); });
  M.querySelectorAll("[data-of]").forEach(b => b.onclick = () => { filter.o = b.dataset.of; render(); });
  M.querySelectorAll("[data-res]").forEach(b => b.onclick = () => resultForm(S.prints.find(x=>x.id===b.dataset.res)));
  M.querySelectorAll("[data-delpr]").forEach(b => b.onclick = () => {
    const pr = S.prints.find(x=>x.id===b.dataset.delpr);
    confirmBox("Delete this print? Its filament goes back to the spools and its units come off stock.", "Delete print", () => { trash("prints", pr); render(); });
  });
  const pq = $("#pq"); if (pq){ pq.oninput = () => { filter.p = pq.value; const pos = pq.selectionStart; render(); const n2=$("#pq"); n2.focus(); n2.setSelectionRange(pos,pos); }; }
}

$("#fab").onclick = () => modal("Quick add", `<div class="sheet">
  <button data-q="print">Log a print<small>deducts filament</small></button>
  <button data-q="sell">Quick sale<small>takes from stock</small></button>
  <button data-q="order">New order<small>for later delivery</small></button>
  <button data-q="product">New product<small>with cost recipe</small></button>
  <button data-q="spool">New spool<small>filament</small></button>
  <button data-q="idea">New idea<small>note it down</small></button></div>`, m => m.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { close(); ({
    print:()=>printForm(), order:()=>orderForm(), product:()=>productForm(), spool:()=>spoolForm(), idea:()=>noteForm("ideas"),
    sell:()=>{ const ps = S.products.filter(p=>n(p.stock)>0); if (!ps.length) return toast("Nothing in stock to sell"); modal("Sell which product?", `<div class="sheet">${ps.map(p=>`<button data-sp="${p.id}">${esc(p.name)}<small>${esc(p.type)} · ${n(p.stock)} in stock</small></button>`).join("")}</div>`, mm => mm.querySelectorAll("[data-sp]").forEach(x => x.onclick = () => { close(); sellForm(product(x.dataset.sp)); })); }
  })[b.dataset.q](); }));
const h = (location.hash||"").slice(1); if (VIEWS.some(v=>v[0]===h)) view = h;
if (/invite=/.test(location.hash)){
  const link = location.href;
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  setTimeout(() => { const inv = parseInvite(link); if (!inv) return toast("This invite link is incomplete."); if (syncOn() && !SY.readonly) return toast("This device is already connected with full access, so the invite was ignored."); useInvite(link); }, 50);
}
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.some(x=>x[0]===v) && v!==view){ view=v; render(); } });
boot();
if ("serviceWorker" in navigator) window.addEventListener("load", async () => {
  try{
    const reg = await navigator.serviceWorker.register("sw.js");
    const offer = w => { if (!w || !navigator.serviceWorker.controller) return;
      $("#updRoot").innerHTML = `<div class="upd" role="status"><span>A new version of WAV is ready.</span><button class="btn sm primary" id="updBtn">Update now</button></div>`;
      $("#updBtn").onclick = () => { $("#updBtn").disabled = true; w.postMessage("skip"); setTimeout(() => location.reload(), 2500); }; };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed") offer(w); }); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}); });
    let reloading = false; navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading) return; reloading = true; location.reload(); });
  }catch(e){}
});
})();
</script>
