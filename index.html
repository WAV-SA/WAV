<title>WAV Print Studio</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: workshop console — left rail with the WAV mark, main bench with summary strip then working tables. Identity: WAV deep teal on warm paper, monoline geometric type. */
:root{
  --bg:#f9f7f5; --surface:#ffffff; --sunk:#f0ece8; --line:#e2ddd7; --ink:#10292c; --muted:#5f6c6d;
  --accent:#12535b; --accent-ink:#ffffff; --accent-soft:#dbe8e9;
  --good:#2f7a4b; --good-soft:#dcefe2; --warn:#a86a00; --warn-soft:#f7e8c8; --bad:#b23a2e; --bad-soft:#f6dcd8;
  --f-display:"Outfit", "Century Gothic", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a1c; --surface:#122427; --sunk:#182e31; --line:#24403f; --ink:#e8f0ef; --muted:#93a7a8;
  --accent:#5fb4bd; --accent-ink:#071618; --accent-soft:#16393d;
  --good:#6cc48c; --good-soft:#1d3326; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#ec7f72; --bad-soft:#3d201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1c; --surface:#122427; --sunk:#182e31; --line:#24403f; --ink:#e8f0ef; --muted:#93a7a8;
  --accent:#5fb4bd; --accent-ink:#071618; --accent-soft:#16393d;
  --good:#6cc48c; --good-soft:#1d3326; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#ec7f72; --bad-soft:#3d201c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 12px 0}
.logo{display:block;color:var(--accent);height:auto}
.logo path{fill:none;stroke:currentColor;stroke-width:38;stroke-linecap:round;stroke-linejoin:round}
.brand small{font-family:var(--f-display);font-weight:400;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.wave{height:10px;color:var(--accent);opacity:.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav .count{font-family:var(--f-mono);font-size:12px;opacity:.75}
.sync{margin-top:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}

main{padding-block:24px 96px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-family:var(--f-display);font-weight:300;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 12px;letter-spacing:.02em}
.sub{color:var(--muted);margin:2px 0 0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:24px}
.strip>div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.kv{font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.kd{font-size:12px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--sunk)}
.name{font-weight:600}
.meta{font-size:12px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);display:inline-block;flex:none}
.swrow{display:flex;gap:3px;align-items:center}

/* spool cards */
.spools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.spool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.spool .top{display:flex;gap:12px;align-items:center}
.reel{width:52px;height:52px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.note p{margin:0;white-space:pre-wrap}

/* modal */
#modal2Root .scrim{z-index:45}
.dur{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dur label{position:relative;display:block}
.dur label span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:500;pointer-events:none}
.dur input{padding-right:40px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none;display:block}
.pname{display:flex;gap:10px;align-items:center;min-width:0}
[data-viewp]{cursor:pointer}
[data-viewp]:hover .name{text-decoration:underline;text-underline-offset:3px}
.hero{width:100%;aspect-ratio:4/3;max-height:320px;object-fit:cover;border-radius:12px;background:var(--sunk);display:block}
.hero.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);font-size:13px;border:1.5px dashed var(--line);background:transparent;aspect-ratio:16/7}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.vgrid>div{background:var(--surface);padding:10px 12px}
@media (max-width:560px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vgrid b{display:block;font-family:var(--f-mono);font-size:17px;margin-top:2px}
.vsec{margin-top:16px}
.vsec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.vrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.vrow:last-child{border-bottom:0}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.act:last-child{border-bottom:0}
.act .what{font-weight:600}
.act .side{text-align:right;white-space:nowrap}
.act .after{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font-size:14px}
textarea{min-height:80px;resize:vertical}
.mat{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.calc{background:var(--sunk);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;font-size:12px;color:var(--muted)}
.calc b{display:block;font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.check input{width:auto}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-align:center}
.seg label small{font-weight:400;font-size:11px;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg label.ok:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.seg label.ko:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.upd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent);width:max-content;max-width:calc(100% - 32px);font-weight:500}
.xbtn{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:var(--accent);margin-top:6px}
.name,.meta,.note p,textarea,input{unicode-bidi:plaintext}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{width:64px;text-align:center;padding:5px 4px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}

@media (max-width:900px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip>div:nth-child(3){border-left:0}
  .strip>div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:var(--surface);border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .brand,.sync{display:none}
  .mlogo{display:block!important;margin-bottom:14px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px}
  .nav button{padding:8px 10px;font-size:13px;white-space:nowrap}
  .nav .count{display:none}
  .nav .lbl{font-size:0}
  .nav .lbl::after{content:attr(data-short);font-size:11px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(190px + env(safe-area-inset-bottom,0px))}
  .form{grid-template-columns:minmax(0,1fr)}
  .calc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{font-size:20px}
}
.mobile-only,.fab,.nav button.mobile-only{display:none}
body.ro .fab,body.ro [data-act]:not([data-act="syncNow"]):not([data-act="syncOff"]):not([data-act="export"]),body.ro [data-step],body.ro [data-sell],body.ro [data-adjp],body.ro [data-editp],body.ro [data-print],body.ro [data-edits],body.ro [data-adj],body.ro [data-edito],body.ro [data-delpr],body.ro [data-note],body.ro [data-editn],body.ro [data-restore],body.ro .ro-hide{display:none!important}
body.ro [data-res],body.ro [data-paid],body.ro [data-count],body.ro [data-ostatus],body.ro .ro-lock{pointer-events:none}
body.ro [data-count]{border-color:transparent;background:transparent}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet button{all:unset;cursor:pointer;padding:16px 14px;border:1px solid var(--line);border-radius:12px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.sheet button small{font-weight:400;color:var(--muted);font-size:12px}
.sheet button:active{background:var(--sunk)}
@media (max-width:720px){
  input,select,textarea{font-size:16px}
  .nav .sec{display:none}
  .mobile-only,.nav button.mobile-only{display:flex}
  .nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible}
  .nav button{flex-direction:column;justify-content:center;gap:3px;padding:6px 2px;font-size:11px;border-radius:10px;text-align:center}
  .nav button svg{width:22px;height:22px}
  .nav button[aria-current="true"]{background:transparent;color:var(--accent)}
  .fab{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;align-items:center;justify-content:center;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 25%,transparent);z-index:31;cursor:pointer}
  .head .row .btn.primary,.head .row [data-act="newPrint"],.head .row [data-act="newOrder"]{display:none}
  .head{margin-bottom:14px}
  .tablewrap{border:0;background:transparent;overflow:visible}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .panel .tablewrap tr{background:var(--bg)}
  .tablewrap tbody tr:hover{background:var(--surface)}
  .tablewrap td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;min-width:0}
  .tablewrap td::before{content:attr(data-label);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;flex:none}
  .tablewrap td:first-child{display:block;text-align:left;padding-bottom:8px;margin-bottom:4px;border-bottom:1px dashed var(--line)}
  .tablewrap td:first-child::before,.tablewrap td[data-label=""]::before{content:none}
  .tablewrap td[data-label=""]{justify-content:flex-end;padding-top:8px}
  .tablewrap td.meta{max-width:none!important}
  .tablewrap tr.cx:not(.open) td:not(:first-child):not(.k):not([data-label=""]){display:none}
  .tablewrap tr.cx td:first-child{border-bottom-style:solid}
  .stepper .btn{width:40px;height:36px;font-size:18px;padding:0}
  .btn.sm{padding:7px 12px}
  .strip .kv{font-size:19px}
  .modal{border-radius:16px 16px 0 0;align-self:flex-end;max-height:calc(100vh - 40px);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .scrim{align-items:flex-end;padding:0}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <aside class="rail">
    <div class="brand"><svg class="logo" viewBox="150 540 960 240" width="132" role="img" aria-label="WAV"><path d="M190 578 L285 745 L375 588 L465 745 L560 578"/><path d="M600 745 L712 586 L822 745"/><path d="M852 578 L963 745 L1074 578"/></svg><small id="wsName">Print studio</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></div>
  </aside>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Quick add">+</button>
<div id="updRoot"></div>
<div id="modalRoot"></div>
<div id="modal2Root"></div>
<div id="toastRoot"></div>

<script>
(() => {
const KEYS = ["products","spools","prints","orders","moves","fil","edits","ideas","lessons","settings","trash"];
const APP_VERSION = "2026.11.13c";
const blank = () => ({products:[],spools:[],prints:[],orders:[],moves:[],fil:[],edits:[],ideas:[],lessons:[],settings:{hour:2,energy:0.2,wear:0,failAllow:true,workspace:"WAV",currency:"SAR",feePct:0,packaging:0,targetMargin:50},trash:[]});
let S = blank();
let view = "home", db = null, mode = "local", loaded = false, filter = {};
const LS = "wav-app-v1";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const cur = () => S.settings.currency || "SAR";
const money = v => n(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const g = v => { const x = n(v); return (Math.round(x*100)/100).toLocaleString("en-US"); };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : "";
const hrs = m => { m = n(m); const h = Math.floor(m/60), r = Math.round(m%60); return h ? `${h}h ${r? r+"m":""}`.trim() : `${r}m`; };
const spool = id => S.spools.find(s => s.id === id);
const product = id => S.products.find(p => p.id === id);
const ppg = s => s && n(s.initial) ? n(s.price)/n(s.initial) : 0;
const runRate = () => n(S.settings.hour) + n(S.settings.energy) + n(S.settings.wear);

function materialCost(materials){ return (materials||[]).reduce((a,m)=>a + n(m.grams)*ppg(spool(m.spoolId ?? m.id)), 0); }
function recipePpg(p){ const ms = (p.materials||[]).filter(m=>n(m.grams)>0), tot = ms.reduce((a,m)=>a+n(m.grams),0);
  if (tot) return ms.reduce((a,m)=>a+n(m.grams)*ppg(spool(m.spoolId)),0)/tot;
  const sp = S.spools.filter(x=>n(x.initial)); return sp.length ? sp.reduce((a,x)=>a+ppg(x),0)/sp.length : 0; }
function failRate(){
  let units = 0, good = 0; S.prints.forEach(pr => { units += n(pr.qty)||1; good += goodOf(pr); });
  return units >= 5 ? Math.max(0, Math.min(0.5, 1 - good/units)) : 0;
}
function costParts(p){
  const fil = materialCost(p.materials), flush = n(p.flush)*recipePpg(p), time = n(p.minutes)/60*runRate();
  const fr = S.settings.failAllow === false ? 0 : failRate(), fail = (fil+flush+time) * (fr/(1-fr));
  return {fil, flush, time, fail, fr, extras:n(p.extras), total: fil+flush+time+fail+n(p.extras)};
}
function unitCost(p){ return costParts(p).total; }
/* grams per unit by spool, with AMS flush waste shared in proportion to the recipe */
function unitGrams(p){
  const ms = (p.materials||[]).filter(m=>n(m.grams)>0), tot = ms.reduce((a,m)=>a+n(m.grams),0);
  return ms.map(m => ({spoolId:m.spoolId, grams: n(m.grams) + (tot ? n(p.flush)*n(m.grams)/tot : 0)}));
}
function bomGrams(p){ const s = (p.materials||[]).reduce((a,m)=>a+n(m.grams),0); return s || n(p.grams); }
function spoolState(s){ const r = n(s.remaining); if (r <= 0) return "bad"; if (r < n(s.min)) return "warn"; return "good"; }
function stockState(p){ const s = n(p.stock); if (s <= 0) return "bad"; if (s < n(p.min)) return "warn"; return "good"; }
function hex(c){ return /^#[0-9a-f]{3,8}$/i.test(c||"") ? c : "#888888"; }

/* ---------- persistence ---------- */
function saveLocal(){ recompute(); try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const t = localStorage.getItem(LS); if (t){ S = Object.assign(blank(), JSON.parse(t)); S.settings = Object.assign(blank().settings, S.settings||{}); KEYS.forEach(k => { if (k!=="settings" && !Array.isArray(S[k])) S[k] = []; }); } }catch(e){} if (ensureLedger()) saveLocal(); recompute(); }
const pending = new Map();
async function persist(...keys){
  saveLocal(); schedulePush();
  if (mode !== "db") return;
  for (const k of keys){
    if (pending.get(k)) { pending.set(k, "again"); continue; }
    pending.set(k, true);
    try{
      do{
        if (pending.get(k) === "again") pending.set(k, true);
        await db.doc("ws/"+k).set({v: JSON.parse(JSON.stringify(S[k]))});
      } while (pending.get(k) === "again");
    }catch(e){
      toast(e && e.code === "quota_exceeded" ? "Storage is full. Empty the trash or export a backup." : "Couldn't save. Your change is kept on this device.");
      setSync("warn","Saved on this device only");
    }finally{ pending.delete(k); }
  }
}
function setSync(kind, text){ $("#syncDot").className = "dot "+(kind||""); $("#syncText").textContent = text; }

/* ---------- GitHub sync ---------- */
const SK = "wav-sync";
let SY = {}; try{ SY = JSON.parse(localStorage.getItem(SK)||"{}")||{}; }catch(e){ SY = {}; }
function saveSY(){ try{ localStorage.setItem(SK, JSON.stringify(SY)); }catch(e){} }
const syncOn = () => !!(SY.token && SY.owner && SY.repo);
let syncing = false, syncAgain = false, pushT = null, changeSeq = 0;
function b64e(str){ const b = new TextEncoder().encode(str); let bin = ""; for (let i=0;i<b.length;i+=0x8000) bin += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(bin); }
function b64d(s64){ const bin = atob(String(s64).replace(/\s/g,"")); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
function normalize(d){ const b = Object.assign(blank(), d||{}); b.settings = Object.assign(blank().settings, (d&&d.settings)||{}); KEYS.forEach(k => { if (k!=="settings" && !Array.isArray(b[k])) b[k] = []; }); return b; }
async function ghFetch(path, opts={}){
  let r;
  try{ r = await fetch(`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}${path}`, {cache:"no-store", ...opts, headers:{Authorization:"Bearer "+SY.token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opts.body?{"Content-Type":"application/json"}:{})}}); }
  catch(e){ const er = new Error("Offline. Changes are saved and will sync when you're back online."); er.offline = true; throw er; }
  return r;
}
function ghError(r){
  if (r.status === 401) return new Error("GitHub token is invalid or expired. Create a new one and paste it in Settings.");
  if (r.status === 403) return new Error("The token can't write to this repository. Give it Contents: Read and write.");
  if (r.status === 404) return new Error(`Repository ${SY.owner}/${SY.repo} not found, or the token can't see it.`);
  return new Error("GitHub error "+r.status+". Try again in a minute.");
}
async function pullRemote(){
  const r = await ghFetch("/contents/data.json?t="+Date.now());
  if (r.status === 404){ const rr = await ghFetch(""); if (!rr.ok) throw ghError(rr); return {missing:true}; }
  if (!r.ok) throw ghError(r);
  const j = await r.json();
  let text;
  if (j.content) text = b64d(j.content);
  else text = await (await fetch(j.download_url, {cache:"no-store"})).text();
  return {sha:j.sha, data:JSON.parse(text)};
}
async function pushRemote(){
  recompute(); const body = {message:"WAV sync "+new Date().toISOString(), content:b64e(JSON.stringify(S))};
  if (SY.sha) body.sha = SY.sha;
  const r = await ghFetch("/contents/data.json", {method:"PUT", body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) return {conflict:true};
  if (!r.ok) throw ghError(r);
  const j = await r.json(); SY.sha = j.content.sha; return {ok:true};
}
function mergeState(Lc, Rc){
  const L = normalize(Lc), Rm = normalize(Rc), out = normalize({});
  const tmap = new Map(); [...Rm.trash, ...L.trash].forEach(t => tmap.set(t.id, t));
  const deadAt = {}; tmap.forEach(t => { const id = t.record && t.record.id; if (id) deadAt[id] = Math.max(deadAt[id]||0, Date.parse(t.deletedAt)||0); });
  const alive = x => x && (!(x.id in deadAt) || (Date.parse(x._restoredAt)||0) > deadAt[x.id]);
  ["products","spools","prints","orders","moves","fil","edits","ideas","lessons"].forEach(k => {
    const m = new Map(); Rm[k].forEach(x => m.set(x.id, x)); L[k].forEach(x => m.set(x.id, x));
    const seen = new Set(), list = [];
    L[k].forEach(x => { if (!seen.has(x.id)){ seen.add(x.id); list.push(m.get(x.id)); } });
    Rm[k].forEach(x => { if (!seen.has(x.id)){ seen.add(x.id); list.push(m.get(x.id)); } });
    out[k] = list.filter(alive);
  });
  const by = f => (a,b) => String(b[f]||"").localeCompare(String(a[f]||""));
  out.prints.sort(by("date")); out.orders.sort(by("created")); out.moves.sort(by("at")); out.fil.sort(by("at")); out.edits.sort(by("at"));
  out.trash = [...tmap.values()].filter(t => { const id = t.record && t.record.id; return !(out[t.kind]||[]).some(x => x.id === id); }).sort(by("deletedAt")).slice(0,300);
  out.settings = Object.assign({}, Rm.settings, L.settings);
  const lbs = [L.settings.lastBackup, Rm.settings.lastBackup].filter(Boolean).sort(); if (lbs.length) out.settings.lastBackup = lbs.pop();
  return out;
}
let applyingRemote = false;
function takeRemote(d){ applyingRemote = true; S = normalize(d); const ch = ensureLedger(); recompute(); saveLocal(); applyingRemote = false; render(); if (ch) persist("moves","fil","settings"); }
function schedulePush(){
  if (applyingRemote || !syncOn() || SY.readonly) return;
  changeSeq++; SY.dirty = true; saveSY();
  clearTimeout(pushT); pushT = setTimeout(() => syncNow(), 1500);
}
function syncLabel(){
  if (!syncOn()) return "Saved on this device";
  if (SY.readonly && !SY.error) return "View only";
  if (SY.error) return SY.offline ? "Offline · will sync" : "Sync problem";
  if (SY.dirty) return "Syncing…";
  return SY.lastSync ? "Synced" : "Connecting…";
}
function showSync(){ document.body.classList.toggle("ro", !!(syncOn() && SY.readonly)); const k = !syncOn() ? "" : SY.error ? "warn" : "ok"; setSync(k, syncLabel()); document.querySelectorAll("[data-sync]").forEach(el => { el.textContent = syncLabel(); el.dataset.state = k; }); }
async function syncNow(manual){
  if (!syncOn()) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; clearTimeout(pushT);
  try{
    for (let attempt = 0; attempt < 4; attempt++){
      if (SY.dirty && !SY.readonly){
        if (!SY.sha){ const rm = await pullRemote(); if (!rm.missing){ SY.sha = rm.sha; takeRemote(mergeState(S, rm.data)); } }
        const seq = changeSeq, res = await pushRemote();
        if (res.conflict){ const rm = await pullRemote(); SY.sha = rm.missing ? null : rm.sha; if (!rm.missing) takeRemote(mergeState(S, rm.data)); continue; }
        if (seq === changeSeq) SY.dirty = false;
      } else {
        const rm = await pullRemote();
        if (rm.missing){ SY.sha = null; SY.dirty = true; continue; }
        if (rm.sha !== SY.sha){ SY.sha = rm.sha; takeRemote(rm.data); }
      }
      break;
    }
    SY.lastSync = new Date().toISOString(); SY.error = ""; SY.offline = false; saveSY(); flushUploads();
    if (manual) toast("Synced");
  }catch(e){
    SY.error = e.message; SY.offline = !!e.offline; saveSY();
    if (manual || !e.offline) toast(e.message);
  }finally{
    syncing = false; showSync();
    if (view === "settings") render();
    if (syncAgain || SY.dirty && !SY.error){ syncAgain = false; clearTimeout(pushT); pushT = setTimeout(() => syncNow(), 1200); }
  }
}
const APP_URL = location.origin + location.pathname;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function b64url(str){ return b64e(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64url(x){ x = x.replace(/-/g,"+").replace(/_/g,"/"); while (x.length % 4) x += "="; return b64d(x); }
function makeInvite(token){ return APP_URL + "#invite=" + b64url(JSON.stringify({o:SY.owner, r:SY.repo, t:token.trim(), v:1})); }
function parseInvite(text){
  const m = String(text||"").match(/invite=([A-Za-z0-9_-]+)/); if (!m) return null;
  try{ const j = JSON.parse(unb64url(m[1])); return (j.o && j.r && j.t) ? j : null; }catch(e){ return null; }
}
function useInvite(text){
  const inv = parseInvite(text);
  if (!inv) return toast("That isn't a WAV invite link. Copy the whole link and try again.");
  try{ localStorage.setItem("wav-invite", String(text).trim()); }catch(e){}
  toast("Connecting…"); connectSync(inv.o, inv.r, inv.t, true);
}
function inviteBox(){ return `<div class="form" style="margin-top:8px"><label class="f full">Have an invite link? Paste it here<input id="inv_text" placeholder="https://wav-sa.github.io/WAV/#invite=…" autocapitalize="off" autocorrect="off"></label></div><div class="foot" style="margin-top:8px"><button class="btn primary" data-act="useInvite">Open shared data</button></div>`; }
function installTip(){
  if (isStandalone()) return "";
  let link = ""; try{ link = localStorage.getItem("wav-invite") || ""; }catch(e){}
  return `<div class="alert warn" style="flex-direction:column;align-items:stretch;gap:8px"><b>Want it as an app on iPhone?</b><span>In Safari tap Share ⬆️ → Add to Home Screen. Open the new WAV icon, then paste your invite link once.</span>${link?`<button class="btn sm" data-act="copyInvite" style="align-self:flex-start">Copy my invite link</button>`:""}</div>`;
}
function copyText(t, ok){ navigator.clipboard.writeText(t).then(() => toast(ok||"Copied"), () => { modal("Copy this", `<textarea id="cpy" readonly style="min-height:120px;font-family:var(--f-mono);font-size:12px">${esc(t)}</textarea><div class="foot"><button class="btn" data-x>Close</button></div>`, m => { m.querySelector("[data-x]").onclick = close; const x = $("#cpy"); x.focus(); x.select(); }); }); }
function shareInviteForm(){
  modal("Share view-only", `<p class="meta">The person can see everything (stock, orders, costs, profit and customers) but can't change anything.</p>
    <ol class="meta" style="padding-left:18px;display:flex;flex-direction:column;gap:4px;margin:0 0 12px">
      <li>Create a read-only token at <span class="mono">github.com/settings/personal-access-tokens/new</span>: name <b>WAV viewer</b>, repository <b>${esc(SY.repo)}</b>, Contents → <b>Read-only</b>.</li>
      <li>Paste it below to make the link.</li></ol>
    <label class="f">Read-only token<input id="vw_token" type="password" autocomplete="off" autocapitalize="off" placeholder="github_pat_…"></label>
    <div id="vw_out" style="margin-top:12px"></div>
    <div class="foot"><button class="btn" data-x>Close</button><button class="btn primary" id="vw_make">Create link</button></div>`, m => {
    m.querySelector("[data-x]").onclick = close;
    $("#vw_make").onclick = async () => {
      const t = $("#vw_token").value.trim(); if (!t) return toast("Paste the read-only token first");
      if (t === SY.token) return toast("That's your own token, which can edit. Make a separate read-only one.");
      // check the token can open the repository
      const saved = {...SY}; SY.token = t; let canRead = false;
      try{ const r = await ghFetch(""); canRead = r.ok; }catch(e){}
      SY = saved;
      if (!canRead) return toast("That token can't open "+SY.repo+". Check it has access to that repository.");
      const link = makeInvite(t);
      $("#vw_out").innerHTML = `<label class="f">Invite link<textarea id="vw_link" readonly style="min-height:90px;font-family:var(--f-mono);font-size:12px">${esc(link)}</textarea></label><div class="row" style="margin-top:8px"><button class="btn primary" id="vw_share">Send…</button><button class="btn" id="vw_copy">Copy link</button></div><p class="meta">To stop access later, delete the WAV viewer token on GitHub.</p>`;
      $("#vw_copy").onclick = () => copyText(link, "Link copied");
      $("#vw_share").onclick = async () => { try{ if (navigator.share){ await navigator.share({title:"WAV Print Studio", text:"View WAV stock and orders:", url:link}); return; } }catch(e){ if (e && e.name === "AbortError") return; } copyText(link, "Link copied"); };
    };
  });
}
async function connectSync(owner, repo, token, readonly){
  SY = {owner:owner.trim(), repo:repo.trim(), token:token.trim(), readonly:!!readonly};
  showSync();
  try{
    const rr = await ghFetch(""); if (!rr.ok) throw ghError(rr);
    const info = await rr.json(); if (!info.private){ throw new Error(`${SY.owner}/${SY.repo} is public. Make it private first so nobody can see your data.`); }
    const rm = await pullRemote();
    saveSY();
    if (SY.readonly){ if (rm.missing) throw new Error("There's no shared data in this repository yet."); SY.sha = rm.sha; SY.dirty = false; SY.lastSync = new Date().toISOString(); saveSY(); takeRemote(rm.data); showSync(); toast("Connected in view-only mode"); return; }
    if (rm.missing){ SY.dirty = true; saveSY(); toast("Connected. Uploading this device's data…"); syncNow(); return; }
    const localHas = S.products.length || S.prints.length || S.orders.length;
    if (!localHas){ SY.sha = rm.sha; SY.dirty = false; saveSY(); takeRemote(rm.data); SY.lastSync = new Date().toISOString(); saveSY(); showSync(); toast("Connected. Cloud data loaded."); return; }
    const rd = normalize(rm.data);
    modal("Data found in the cloud", `<p>The cloud has ${rd.products.length} products, ${rd.prints.length} prints and ${rd.orders.length} orders. This device has ${S.products.length} products, ${S.prints.length} prints and ${S.orders.length} orders.</p>
      <div class="sheet" style="grid-template-columns:minmax(0,1fr)">
        <button data-c="cloud">Use the cloud data<small>Replaces what's on this device. Best for a new phone or computer.</small></button>
        <button data-c="merge">Merge both<small>Keeps everything from both. Edits on this device win if the same item changed.</small></button></div>`, m => {
      m.querySelector('[data-c="cloud"]').onclick = () => { close(); SY.sha = rm.sha; SY.dirty = false; SY.lastSync = new Date().toISOString(); saveSY(); takeRemote(rm.data); showSync(); toast("Cloud data loaded"); };
      m.querySelector('[data-c="merge"]').onclick = () => { close(); SY.sha = rm.sha; takeRemote(mergeState(S, rm.data)); SY.dirty = true; saveSY(); syncNow(true); };
    });
  }catch(e){ SY = {}; saveSY(); showSync(); toast(e.message); render(); }
}
async function listVersions(){
  const r = await ghFetch("/commits?path=data.json&per_page=50"); if (!r.ok) throw ghError(r);
  return (await r.json()).map(c => ({sha:c.sha, date:(c.commit && (c.commit.committer||c.commit.author||{}).date) || ""}));
}
async function getVersion(sha){
  const r = await ghFetch("/contents/data.json?ref="+encodeURIComponent(sha)); if (!r.ok) throw ghError(r);
  const j = await r.json(); return JSON.parse(j.content ? b64d(j.content) : await (await fetch(j.download_url, {cache:"no-store"})).text());
}
function summarize(d){ const x = normalize(d); return `${x.products.length} products · ${x.spools.length} spools · ${x.prints.length} prints · ${x.orders.length} orders`; }
async function historyForm(){
  modal("Version history", `<p class="meta">Every change you save is kept on GitHub. Pick a time to see what was there, then restore it if you need to.</p><div id="vh" class="list" style="gap:0"><p class="meta">Loading…</p></div><div class="foot"><button class="btn" data-x>Close</button></div>`, async m => {
    m.querySelector("[data-x]").onclick = close;
    try{
      const vs = await listVersions();
      const fmt = iso => new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      $("#vh").innerHTML = vs.length ? vs.map((v,i) => `<div class="item"><div><div class="name">${fmt(v.date)}${i===0?` <span class="pill good">Current</span>`:""}</div><div class="meta" data-sum="${v.sha}"></div></div>${i===0?"":`<button class="btn sm" data-ver="${v.sha}">View</button>`}</div>`).join("") : `<p class="meta">No saved versions yet.</p>`;
      m.querySelectorAll("[data-ver]").forEach(b => b.onclick = async () => {
        b.disabled = true; b.textContent = "Loading…";
        try{
          const d = await getVersion(b.dataset.ver);
          m.querySelector(`[data-sum="${b.dataset.ver}"]`).textContent = summarize(d);
          b.disabled = false; b.textContent = "Restore"; b.classList.add("primary");
          b.onclick = () => { close(); confirmBox(`Replace your current data (${summarize(S)}) with this version (${summarize(d)})? The current data stays in the history, so you can switch back.`, "Restore", () => {
            S = normalize(d); ensureLedger(); recompute(); persist(...KEYS); render(); toast("Version restored"); }); };
        }catch(e){ b.disabled = false; b.textContent = "View"; toast(e.message); }
      });
    }catch(e){ $("#vh").innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
  });
}
function disconnectSync(){ SY = {}; saveSY(); showSync(); render(); toast("Sync turned off on this device. Your data stays here."); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", () => syncNow());
setInterval(() => { if (document.visibilityState === "visible" && !SY.dirty) syncNow(); }, 60000);

async function boot(){
  loadLocal(); render();
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if (!window.claude || !window.claude.use){ showSync(); if (syncOn()) syncNow(); return; }
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if (!db){ setSync("warn","Saved on this device"); return; }
  mode = "db";
  const timer = setTimeout(()=> setSync("warn","Can't reach saved data yet"), 10000);
  db.collection("ws").onSnapshot(snap => {
    if (!snap.metadata.fromCache){ clearTimeout(timer); setSync("ok","Synced"); }
    if (snap.empty && !snap.metadata.fromCache && !loaded){
      loaded = true;
      if (S.products.length || S.spools.length) persist(...KEYS); // move device data up
      render(); return;
    }
    snap.docs.forEach(d => { if (KEYS.includes(d.id) && !pending.get(d.id)) S[d.id] = JSON.parse(JSON.stringify(d.data().v ?? (d.id==="settings"?{}:[]))); });
    S = Object.assign(blank(), S); S.settings = Object.assign(blank().settings, S.settings||{});
    loaded = true; saveLocal(); render();
  }, err => { clearTimeout(timer); setSync("warn","Saved on this device only"); mode = "local"; });
}

/* ---------- business logic ---------- */
/* Stock and filament are worked out from records, never stored as a bare number:
   product stock = starting balance + manual adjustments + good units printed - units in delivered orders
   spool grams   = starting balance + weigh-ins/adjustments - grams used by prints
   Records merge cleanly between devices, and deleting a print or order reverses its effect. */
function goodOf(pr){ return pr.goodQty !== undefined ? n(pr.goodQty) : (pr.good ? n(pr.qty) : 0); }
function ensureLedger(){
  let changed = false; const now = new Date().toISOString();
  if (!S.settings.ledgerAt){ S.settings.ledgerAt = now; changed = true; }
  const mids = new Set(S.moves.map(m=>m.id)), fids = new Set(S.fil.map(f=>f.id));
  S.products.forEach(p => { if (mids.has("open-"+p.id)) return;
    let c = 0; S.prints.forEach(pr => { if (pr.product===p.id) c += goodOf(pr); });
    S.orders.forEach(o => { if (o.status==="delivered") (o.items||[]).forEach(i => { if (i.product===p.id) c -= n(i.qty); }); });
    S.moves.push({id:"open-"+p.id, product:p.id, delta:Math.round(n(p.stock)-c), opening:true, reason:"Starting balance", at:now, date:today()}); changed = true; });
  S.spools.forEach(sp => { if (fids.has("sopen-"+sp.id)) return;
    let u = 0; S.prints.forEach(pr => (pr.usage||[]).forEach(x => { if (x.id===sp.id) u += n(x.grams); }));
    S.fil.push({id:"sopen-"+sp.id, spool:sp.id, delta:Math.round((n(sp.remaining)+u)*100)/100, opening:true, reason:"Starting balance", at:now}); changed = true; });
  return changed;
}
function recompute(){
  const st = {}, rem = {};
  S.moves.forEach(m => { if (m.opening || m.adj) st[m.product] = (st[m.product]||0) + n(m.delta); });
  S.prints.forEach(pr => { st[pr.product] = (st[pr.product]||0) + goodOf(pr); (pr.usage||[]).forEach(u => { rem[u.id] = (rem[u.id]||0) - n(u.grams); }); });
  S.orders.forEach(o => { if (o.status==="delivered") (o.items||[]).forEach(i => { st[i.product] = (st[i.product]||0) - n(i.qty); }); });
  S.fil.forEach(f => { rem[f.spool] = (rem[f.spool]||0) + n(f.delta); });
  S.products.forEach(p => { p.stock = Math.round(st[p.id]||0); });
  S.spools.forEach(sp => { sp.remaining = Math.round((rem[sp.id]||0)*100)/100; });
}
function logMove(pid, delta, reason, note){
  delta = Math.round(n(delta)); if (!delta) return;
  recompute(); const p = product(pid);
  S.moves.unshift({id:uid(), adj:true, date:today(), at:new Date().toISOString(), product:pid, delta, reason, note:note||"", after:p?n(p.stock)+delta:null});
  persist("moves");
}
function logFil(sid, delta, reason){
  delta = Math.round(n(delta)*100)/100; if (!delta) return;
  S.fil.unshift({id:uid(), adj:true, spool:sid, delta, reason, at:new Date().toISOString()});
  persist("fil");
}
function stockTimeline(){
  const since = S.settings.ledgerAt || "", out = [];
  S.moves.forEach(m => { if (m.opening) return; out.push({at:m.at||m.date, product:m.product, delta:n(m.delta), reason:m.reason, note:m.note}); });
  S.prints.forEach(pr => { if (pr.at && pr.at >= since && goodOf(pr)) out.push({at:pr.at, product:pr.product, delta:goodOf(pr), reason:"Printed"}); });
  S.orders.forEach(o => { if (o.status==="delivered" && o.deliveredTs && o.deliveredTs >= since) (o.items||[]).forEach(i => out.push({at:o.deliveredTs, product:i.product, delta:-n(i.qty), reason:"Sold", note:o.customer||""})); });
  return out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
const OPEN = ["new","printing","ready"];
function reserved(pid){ return S.orders.filter(o=>OPEN.includes(o.status)).reduce((a,o)=>a+(o.items||[]).filter(i=>i.product===pid).reduce((b,i)=>b+n(i.qty),0),0); }
function available(p){ return n(p.stock) - reserved(p.id); }
function suggestPrice(cost){ const m = n(S.settings.targetMargin)/100, f = n(S.settings.feePct)/100; const d = 1-m-f; return d>0.05 ? Math.ceil(cost/d) : 0; }
const CATS = [["final","Final product"],["prototype","Prototype"]];
const catOf = p => p && p.category === "prototype" ? "prototype" : "final";
const catPill = p => catOf(p) === "prototype" ? ` <span class="pill warn" style="vertical-align:1px">Prototype</span>` : ` <span class="pill good" style="vertical-align:1px">Final</span>`;
function restockPlan(){
  return S.products.filter(p => catOf(p) === "final").map(p => { const need = Math.max(0, n(p.min) - available(p)); return {p, need}; }).filter(x=>x.need>0)
    .map(x => ({...x, minutes:n(x.p.minutes)*x.need, mats:unitGrams(x.p).map(m=>({spoolId:m.spoolId, grams:m.grams*x.need}))}));
}
function logPrint(rec){
  const ordId = String(rec.product||"").startsWith("order:") ? rec.product.slice(6) : null, ord = ordId ? S.orders.find(o => o.id === ordId) : null;
  if (ordId){ rec = {...rec, product:null, name:"Special · " + (ord?.customer || "order")}; }
  const p = ordId ? null : product(rec.product);
  const usage = rec.usage.filter(u => n(u.grams) > 0).map(u => { const s = spool(u.id); return {id:u.id, grams:n(u.grams), name:s?.name||"", color:s?.color||"", pricePerGram:+ppg(s).toFixed(4)}; });
  const grams = usage.reduce((a,u)=>a+u.grams,0);
  const cost = usage.reduce((a,u)=>a+u.grams*u.pricePerGram,0) + n(rec.minutes)/60*runRate() + (p ? n(p.extras)*n(rec.qty) : 0);
  const qty = n(rec.qty)||1, goodQty = Math.max(0, Math.min(qty, Math.round(n(rec.goodQty))));
  const pr = {id:uid(), at:new Date().toISOString(), name:p?.name||rec.name||"Print", product:rec.product, date:rec.date||today(), qty, goodQty, minutes:n(rec.minutes), grams:Math.round(grams*100)/100, usage, good:goodQty>0, failReason:goodQty<qty?(rec.failReason||""):"", progress:goodQty===0 && rec.progress<100 ? rec.progress : undefined, notes:rec.notes||"", cost};
  recompute();
  if (p && goodQty > 0){
    const before = Math.max(0, n(p.stock)), unit = cost/goodQty;
    p.avgCost = before > 0 ? (n(p.avgCost)*before + unit*goodQty)/(before+goodQty) : unit;
  }
  if (ordId){ pr.order = ordId; if (ord && ord.status === "new") ord.status = "printing"; }
  S.prints.unshift(pr);
  persist("prints","products","orders");
}
function resultPill(pr){
  const gq = goodOf(pr), q = n(pr.qty)||1;
  if (gq >= q) return `<span class="pill good">Success</span>`;
  if (gq > 0) return `<span class="pill warn">Partial ${gq}/${q}</span>`;
  return `<span class="pill bad">Failed</span>`;
}
const REASONS = ["Bed adhesion / warping","Spaghetti / detached","Layer shift","Clog / under-extrusion","Filament ran out","Stringing / quality","Power or network cut","Cancelled by me","Other"];
function trash(kind, rec){
  S[kind] = S[kind].filter(x => x.id !== rec.id);

function restore(t){

  t.record._restoredAt = new Date().toISOString();

function canMake(p){
  const mats = unitGrams(p);
  if (!mats.length) return Infinity;
  return Math.min(...mats.map(m => { const s = spool(m.spoolId); return s ? Math.floor(n(s.remaining)/n(m.grams)) : 0; }));
}

  const list = S.prints.filter(p => f==="all" || (f==="good" ? goodOf(p)>=(n(p.qty)||1) : goodOf(p)<(n(p.qty)||1)));
  const waste = S.prints.reduce((a,p)=>{ const q=n(p.qty)||1; return a + n(p.grams)*(q-goodOf(p))/q; },0);
  return head("Print log", `${S.prints.length} prints · ${g(S.prints.reduce((a,p)=>a+n(p.grams),0))} g used · ${g(waste)} g wasted on failures`, `<div class="tabs">${[["all","All"],["good","Success"],["bad","Failed / partial"]].map(([k,l])=>`<button data-prf="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div><button class="btn primary" data-act="newPrint">Log a print</button>`) +
  (list.length ? `<div class="tablewrap"><table data-compact><thead><tr><th>Date</th><th>Product</th><th class="r">Qty</th><th>Filament used</th><th class="r">Time</th><th class="r">Cost</th><th>Result</th><th>Notes</th><th></th></tr></thead><tbody>${list.map(pr=>{
    const p = product(pr.product), po = pr.order ? S.orders.find(o => o.id === pr.order) : null;
    const mismatch = p && pr.name && pr.name !== p.name;
    return `<tr><td class="num">${fmtDate(pr.date)}</td><td><div class="name">${pr.order ? `<span class="pill neutral">Special</span> ${esc(po?.customer||"order")}` : esc(p?.name||pr.name)}</div><div class="meta">${esc(pr.order ? (po?.custom?.desc||"Deleted order").slice(0,60) : (p?.type||"Deleted product"))}${mismatch?` · logged as “${esc(pr.name)}”`:""}</div></td><td class="r num">${n(pr.qty)}</td>
    <td><div class="swrow">${(pr.usage||[]).filter(u=>n(u.grams)>0).map(u=>{const s=spool(u.id);return `<span class="sw" title="${esc(s?.name||u.name||"")}" style="background:${hex(s?.color||u.color)}"></span>`}).join("")}<span class="num meta" style="margin-left:6px">${g(pr.grams)} g</span></div></td>
    <td class="r num">${hrs(pr.minutes)}</td><td class="r num">${money(pr.cost)}</td><td class="k"><button class="btn ghost sm" data-res="${pr.id}" title="Change result" style="padding:0">${resultPill(pr)}</button>${pr.failReason?`<div class="meta">${esc(pr.failReason)}</div>`:""}</td><td class="meta" style="max-width:220px">${esc(pr.notes)}</td>

  : `<div class="empty">No prints here yet.</div>`);
}

function reelSvg(s){
  const pct = Math.min(1, n(s.remaining)/(n(s.initial)||1));
  const r = 12 + 12*pct;
  return `<svg class="reel" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25" fill="var(--sunk)" stroke="var(--line)"/><circle cx="26" cy="26" r="${r.toFixed(1)}" fill="${hex(s.color)}" stroke="color-mix(in srgb,var(--ink) 20%,transparent)"/><circle cx="26" cy="26" r="9" fill="var(--surface)" stroke="var(--line)"/><circle cx="26" cy="26" r="3" fill="var(--line)"/></svg>`;
}
function vSpools(){
  const total = S.spools.reduce((a,s)=>a+n(s.remaining),0);
  return head("Filament", `${S.spools.length} spools · ${g(total)} g on hand`, `<button class="btn primary" data-act="newSpool">Add spool</button>`) +
  (S.spools.length ? `<div class="spools">${S.spools.map(s=>{ const st=spoolState(s), pct=Math.min(100,n(s.remaining)/(n(s.initial)||1)*100);
    const used = S.prints.reduce((a,pr)=>a+(pr.usage||[]).filter(u=>u.id===s.id).reduce((b,u)=>b+n(u.grams),0),0);
    return `<article class="spool"><div class="top">${reelSvg(s)}<div style="min-width:0"><div class="name" style="overflow-wrap:anywhere">${esc(s.name.trim())}</div><div class="meta num">${money(ppg(s))} ${cur()}/g · ${money(s.price)} per spool</div></div></div>
    <div><div class="row" style="justify-content:space-between"><span class="num" style="font-weight:600">${g(s.remaining)} g</span><span class="pill ${st}">${st==="good"?"OK":st==="warn"?"Low":"Empty"}</span></div><div class="bar" style="margin-top:6px"><i style="width:${pct}%;background:var(--${st==="good"?"accent":st})"></i></div><div class="meta" style="margin-top:6px">of ${g(s.initial)} g · ${g(used)} g logged in prints</div></div>

    <div class="list" style="gap:6px;margin-top:12px"><div class="eyebrow">Filament needed</div>${Object.entries(need).map(([id,gr])=>{ const sp=spool(id), short = !sp || n(sp.remaining) < gr; return `<div class="row" style="justify-content:space-between"><span class="row" style="gap:8px"><span class="sw" style="background:${hex(sp?.color)}"></span>${esc(sp?.name.trim()||"Deleted spool")}</span><span class="num ${short?"":"meta"}" style="${short?"color:var(--bad);font-weight:600":""}">${g(gr)} g / ${g(sp?.remaining)} g${short?" · buy more":""}</span></div>`; }).join("")}</div>` : `<p class="meta">Every product is at or above its minimum.</p>`}</section>
  <section class="panel"><h2>Stock history</h2>${stockTimeline().length ? `<div class="list" style="gap:0">${stockTimeline().slice(0,30).map(m=>`<div class="item"><div style="min-width:0"><div class="name">${esc(product(m.product)?.name||"Deleted product")} <span class="meta">${esc(m.reason)}${m.note?" · "+esc(m.note):""}</span></div><div class="meta">${fmtDate(String(m.at).slice(0,10))}</div></div><span class="num" style="font-weight:600;color:var(--${m.delta>0?"good":"bad"})">${m.delta>0?"+":""}${m.delta}</span></div>`).join("")}</div>` : `<p class="meta">Changes to stock will show here.</p>`}</section></div>`;

function setStock(pid, value, reason, note){
  recompute(); const p = product(pid); if (!p) return; const b = n(p.stock), v = Math.max(0, Math.round(n(value)));
  if (v === b) return; logMove(pid, v-b, reason, note); render();
}

function vReports(){
  const per = filter.rp || "all";
  const now = today().slice(0,7);
  const months = []; { const d = new Date(); d.setDate(1); for (let i=5;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); months.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")); } }
  const inPer = o => { const m = orderDate(o).slice(0,7); return per==="all" || (per==="month" ? m===now : months.slice(3).includes(m)); };
  const sold = S.orders.filter(o=>o.status==="delivered" && inPer(o));
  const rev = sold.reduce((a,o)=>a+orderTotal(o),0), net = sold.reduce((a,o)=>a+orderNet(o),0), units = sold.reduce((a,o)=>a+(isSpecial(o)?1:(o.items||[]).reduce((b,i)=>b+n(i.qty),0)),0);
  const by = {}; sold.forEach(o => { if (isSpecial(o)){ by.__special = by.__special||{u:0,r:0}; by.__special.u += 1; by.__special.r += orderSub(o); return; } (o.items||[]).forEach(i => { const k=i.product; by[k] = by[k]||{u:0,r:0}; by[k].u += n(i.qty); by[k].r += n(i.qty)*n(i.price); }); });
  const ch = {}; sold.forEach(o => { const k=o.channel||"Not set"; ch[k] = ch[k]||{n:0,r:0}; ch[k].n++; ch[k].r += orderTotal(o); });
  const cu = {}; S.orders.filter(o=>o.status==="delivered" && o.customer).forEach(o => { const k=o.customer.trim().toLowerCase(); cu[k] = cu[k]||{name:o.customer,n:0,r:0}; cu[k].n++; cu[k].r += orderTotal(o); });
  const repeat = Object.values(cu).filter(c=>c.n>1).length;
  const mdata = months.map(m => { const os = S.orders.filter(o=>o.status==="delivered" && orderDate(o).slice(0,7)===m); return {m, r:os.reduce((a,o)=>a+orderTotal(o),0), p:os.reduce((a,o)=>a+orderNet(o),0)}; });
  return head("Sales", "Delivered orders only.", `<div class="tabs">${[["month","This month"],["q","Last 3 months"],["all","All time"]].map(([k,l])=>`<button data-rp="${k}" aria-pressed="${per===k}">${l}</button>`).join("")}</div>`) + `
  <div class="strip">
    <div><div class="eyebrow">Revenue</div><div class="kv">${money(rev)}<small>${cur()}</small></div><div class="kd">${sold.length} orders</div></div>
    <div><div class="eyebrow">Net profit</div><div class="kv">${money(net)}<small>${cur()}</small></div><div class="kd">${rev?Math.round(net/rev*100):0}% of revenue</div></div>
    <div><div class="eyebrow">Units sold</div><div class="kv">${units}</div><div class="kd">avg order ${money(sold.length?rev/sold.length:0)}</div></div>
    <div><div class="eyebrow">Customers</div><div class="kv">${Object.keys(cu).length}</div><div class="kd">${repeat} came back</div></div>
  </div>
  <section class="panel" style="margin-bottom:20px"><div class="row" style="justify-content:space-between"><h2>Last 6 months</h2><span class="row meta" style="gap:12px"><span class="row" style="gap:5px"><i class="sw" style="background:var(--accent);border:0;border-radius:2px"></i>Revenue</span><span class="row" style="gap:5px"><i class="sw" style="background:var(--good);border:0;border-radius:2px"></i>Net profit</span></span></div>${barChart(mdata)}</section>
  <div class="grid2">
    <section class="panel"><h2>Best sellers</h2>${Object.keys(by).length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Product</th><th class="r">Units</th><th class="r">Revenue</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].u-a[1].u).map(([k,v])=>`<tr><td><div class="name">${k==="__special"?"Special orders":esc(product(k)?.name||"Deleted")}</div><div class="meta">${k==="__special"?"custom work":esc(product(k)?.type||"")}</div></td><td class="r num">${v.u}</td><td class="r num">${money(v.r)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="meta">No delivered orders in this period. Record sales from Orders or the Sell button in Inventory.</p>`}</section>
    <section class="panel"><h2>By channel</h2>${Object.keys(ch).length?Object.entries(ch).sort((a,b)=>b[1].r-a[1].r).map(([k,v])=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${esc(k)} <span class="meta">${v.n} order${v.n>1?"s":""}</span></span><span class="num">${money(v.r)}</span></div><div class="bar" style="margin-top:5px"><i style="width:${rev?v.r/rev*100:0}%;background:var(--accent)"></i></div></div>`).join(""):`<p class="meta">Nothing yet.</p>`}
      ${Object.keys(cu).length?`<h2 style="margin-top:20px">Top customers</h2>${Object.values(cu).sort((a,b)=>b.r-a.r).slice(0,5).map(c=>`<div class="item"><span>${esc(c.name)} <span class="meta">${c.n} order${c.n>1?"s":""}</span></span><span class="num">${money(c.r)}</span></div>`).join("")}`:""}</section>
  </div>`;
}
function barChart(d){
  const W=640,H=200,L=44,B=24,T=10, max = Math.max(1, ...d.map(x=>Math.max(x.r,x.p)));
  const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max/step)*step, ticks=[0,top/2,top];
  const y = v => T + (H-T-B)*(1 - Math.max(0,v)/top), cw = (W-L)/d.length, bw = Math.min(26, cw/3);
  const mn = m => new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"short"});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto;display:block" role="img" aria-label="Monthly revenue and profit">
  ${ticks.map(t=>`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t?'stroke-dasharray="3 4"':""}/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${t>=1000?(t/1000)+"k":t}</text>`).join("")}
  ${d.map((x,i)=>{ const cx = L + cw*i + cw/2; return `<rect x="${cx-bw-1}" y="${y(x.r)}" width="${bw}" height="${y(0)-y(x.r)}" rx="3" fill="var(--accent)"><title>${mn(x.m)} revenue ${money(x.r)}</title></rect><rect x="${cx+1}" y="${y(x.p)}" width="${bw}" height="${y(0)-y(x.p)}" rx="3" fill="var(--good)"><title>${mn(x.m)} net ${money(x.p)}</title></rect><text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${mn(x.m)}</text>`; }).join("")}
  </svg></div>`;
}

const STATUSES = [["new","New","neutral"],["printing","Printing","warn"],["ready","Ready","good"],["delivered","Delivered","good"],["cancelled","Cancelled","bad"]];
const CHANNELS = ["Online store","Instagram","WhatsApp","TikTok","Snapchat","In person","Bazaar / exhibition","Other"];
const isSpecial = o => o && o.kind === "special";
function specialPrints(o){ return S.prints.filter(pr => pr.order === o.id); }
function specialEstimate(o){ const c = o.custom||{}; return materialCost((c.est||[]).map(e => ({spoolId:e.spoolId, grams:e.grams}))) + n(c.estMin)/60*runRate(); }
function orderSub(o){ return isSpecial(o) ? n(o.custom?.price) : (o.items||[]).reduce((a,i)=>a+n(i.qty)*n(i.price),0); }
function orderDue(o){ return o.paid ? 0 : Math.max(0, orderTotal(o) - n(o.custom?.deposit)); }
function orderTotal(o){ return orderSub(o) - n(o.discount) + n(o.shipCharge); }
function orderFees(o){ return orderTotal(o) * n(o.feePct ?? S.settings.feePct)/100; }
function orderNet(o){ return orderTotal(o) - orderFees(o) - n(o.shipCost) - n(o.packaging ?? S.settings.packaging) - orderCost(o); }
function orderDate(o){ return o.deliveredAt || o.created || o.due || ""; }
function orderCost(o){ if (isSpecial(o)){ const ps = specialPrints(o); return ps.length ? ps.reduce((a,x)=>a+n(x.cost),0) : specialEstimate(o); } return (o.items||[]).reduce((a,i)=>{ const p=product(i.product); return a + n(i.qty)*(p?(n(p.avgCost)||unitCost(p)):0); },0); }
function vOrders(){

  (list.length ? `<div class="tablewrap"><table data-compact><thead><tr><th>Customer</th><th>Items</th><th>Due</th><th class="r">Total</th><th class="r">Net profit</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${list.map(o=>{
    const st = STATUSES.find(s=>s[0]===o.status)||STATUSES[0], t=orderTotal(o);
    const short = (o.items||[]).some(i=>{const p=product(i.product);return p && n(p.stock)<n(i.qty)}) && !["delivered","cancelled"].includes(o.status);
    return `<tr><td><div class="name">${esc(o.customer||"—")}${isSpecial(o)?` <span class="pill neutral" style="vertical-align:1px">Special</span>`:""}</div><div class="meta">${esc([o.channel,o.contact].filter(Boolean).join(" · "))}</div></td>
    <td>${isSpecial(o) ? `<div class="pname">${o.custom?.photo?`<img class="thumb" data-ophoto="${o.id}" alt="" width="44" height="44">`:""}<div style="min-width:0"><div><span class="pill neutral">Special</span> ${esc((o.custom?.desc||"").slice(0,70))}${(o.custom?.desc||"").length>70?"…":""}</div><div class="meta">${specialPrints(o).length ? `${specialPrints(o).length} print${specialPrints(o).length>1?"s":""} · cost ${money(orderCost(o))}` : `estimated cost ${money(orderCost(o))}`}</div></div></div>` : (o.items||[]).map(i=>`<div>${n(i.qty)}× ${esc(product(i.product)?.name||"?")} <span class="meta">${esc(product(i.product)?.type||"")}</span></div>`).join("")}${short?`<span class="pill warn">Not enough stock</span>`:""}</td>

/* ---------- product photos: shrunk on the device, kept in IndexedDB, uploaded once to images/ in the sync repository ---------- */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try{ const r = indexedDB.open("wav-img", 1); r.onupgradeneeded = () => r.result.createObjectStore("imgs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }));
  const run = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction("imgs", mode), rq = fn(t.objectStore("imgs")); t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); }); };
  return { get: id => run("readonly", st => st.get(id)).catch(() => null), put: (id, b) => run("readwrite", st => st.put(b, id)).catch(() => null) };
})();
const photoURLs = {};
async function shrinkImage(file){
  let src, w, h;
  try{ src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch(e){ const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); src = img; w = img.naturalWidth; h = img.naturalHeight; }
  const k = Math.min(1, 900/Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w*k); c.height = Math.round(h*k); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.78));
}
function blobToB64(b){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); }); }
function pendingUploads(){ try{ return JSON.parse(localStorage.getItem("wav-img-pending")||"[]"); }catch(e){ return []; } }
function setPending(l){ try{ localStorage.setItem("wav-img-pending", JSON.stringify(l)); }catch(e){} }
let uploading = false;
async function flushUploads(){
  if (uploading || !syncOn() || SY.readonly) return; const list = pendingUploads(); if (!list.length) return;
  uploading = true;
  try{
    for (const ph of list){
      const b = await IDB.get(ph.id); if (!b){ setPending(pendingUploads().filter(x => x.id !== ph.id)); continue; }
      const r = await ghFetch("/contents/"+ph.path, {method:"PUT", body:JSON.stringify({message:"WAV photo "+ph.id, content:await blobToB64(b)})});
      if (r.ok || r.status === 422) setPending(pendingUploads().filter(x => x.id !== ph.id)); else break;
    }
  }catch(e){} finally{ uploading = false; }
}
async function photoURL(ph){
  if (!ph || !ph.id) return null; if (photoURLs[ph.id]) return photoURLs[ph.id];
  let b = await IDB.get(ph.id);
  if (!b && syncOn()){
    try{ const r = await ghFetch("/contents/"+ph.path); if (r.ok){ const j = await r.json();
        const bin = atob(String(j.content||"").replace(/\s/g,"")), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
        if (u.length){ b = new Blob([u], {type:"image/jpeg"}); IDB.put(ph.id, b); } } }catch(e){}
  }
  return b ? (photoURLs[ph.id] = URL.createObjectURL(b)) : null;
}
function hydratePhotos(root){
  (root||document).querySelectorAll("img[data-photo]").forEach(async img => { const p = product(img.dataset.photo); const u = p && await photoURL(p.photo); if (u) img.src = u; else img.style.visibility = "hidden"; });
  (root||document).querySelectorAll("img[data-ophoto]").forEach(async img => { const o = S.orders.find(x => x.id === img.dataset.ophoto); const u = o && await photoURL(o.custom?.photo); if (u) img.src = u; else img.style.visibility = "hidden"; });
}
const thumb = p => p && p.photo ? `<img class="thumb" data-photo="${p.id}" alt="" width="44" height="44">` : "";
const pname = p => `<div class="pname" data-viewp="${p.id}">${thumb(p)}<div style="min-width:0"><div class="name">${esc(p.name)}${catPill(p)}</div><div class="meta">${esc(p.type)}</div></div></div>`;
async function savePhoto(p, file){
  const b = await shrinkImage(file); if (!b) throw new Error("Couldn't read that photo. Try a JPEG or PNG.");
  const id = "img-" + uid(); await IDB.put(id, b); photoURLs[id] = URL.createObjectURL(b);
  const ph = {id, path:"images/"+id+".jpg"}; setPending([...pendingUploads(), ph]); flushUploads();
  return ph;
}
function pickImage(cb){ const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.onchange = () => { const f = inp.files[0]; if (f) cb(f); }; inp.click(); }

function recipeSig(p){ return (p.materials||[]).filter(m=>n(m.grams)>0).map(m=>m.spoolId+":"+n(m.grams)).sort().join("|"); }
function logProductEdit(before, after){
  const at = new Date().toISOString(), ch = [];
  if (!before){ S.edits.unshift({id:uid(), product:after.id, at, created:true, changes:[]}); persist("edits"); return; }
  const f = (label, a, b, show) => { if (String(a ?? "") !== String(b ?? "")) ch.push({label, from: show ? show(a) : a, to: show ? show(b) : b}); };
  f("Code", before.name, after.name); f("Name", before.type, after.type);
  f("Category", catOf(before), catOf(after), v => v === "prototype" ? "Prototype" : "Final");
  f("Price", n(before.price), n(after.price), money); f("Print time", n(before.minutes), n(after.minutes), hrs);
  f("Minimum stock", n(before.min), n(after.min)); f("Extras", n(before.extras), n(after.extras), money);
  f("Colour-change waste", n(before.flush), n(after.flush), v => g(v)+" g"); f("NFC chip", !!before.nfc, !!after.nfc, v => v ? "Yes" : "No");
  if (recipeSig(before) !== recipeSig(after)) ch.push({label:"Recipe", from:g(bomGrams(before))+" g", to:g(bomGrams(after))+" g"});
  const ph = x => x.photo && x.photo.id; if (ph(before) !== ph(after)) ch.push({label:"Photo", from:"", to: !ph(after) ? "removed" : ph(before) ? "changed" : "added"});
  if (ch.length){ S.edits.unshift({id:uid(), product:after.id, at, changes:ch}); persist("edits"); }
}
function productActivity(pid){
  const ev = [], when = (a, d) => a || (d ? d+"T12:00:00" : "");
  S.prints.filter(x => x.product === pid).forEach(pr => {
    const q = n(pr.qty)||1, gq = goodOf(pr);
    const res = gq >= q ? "Success" : gq > 0 ? `Partial ${gq}/${q}` : (pr.progress ? `Failed at ${pr.progress}%` : "Failed");
    ev.push({at:when(pr.at, pr.date), kind:"print", delta:gq, what:`Printed ${q} · ${res}`,
      detail:[`${g(pr.grams)} g`, hrs(pr.minutes), `${money(pr.cost)} ${cur()}`, pr.failReason, pr.notes].filter(Boolean).join(" · "), tone: gq >= q ? "good" : gq > 0 ? "warn" : "bad"});
  });

async function parseBambu(file){

    const cfg = await zipRead(z, "Metadata/slice_info.config");
    if (!cfg) throw new Error("This project hasn't been sliced yet. In Bambu Studio press Slice plate, then File → Export → Export plate sliced file (.gcode.3mf).");
    const doc = new DOMParser().parseFromString(cfg, "application/xml"), plates = [];
    for (const pl of doc.querySelectorAll("plate")){
      const meta = k => pl.querySelector(`metadata[key="${k}"]`)?.getAttribute("value");
      const idx = meta("index") || String(plates.length+1);
      let fils = [...pl.querySelectorAll("filament")].map(f => ({id:f.getAttribute("id"), type:f.getAttribute("type")||"", color:(f.getAttribute("color")||"").slice(0,7), grams:n(f.getAttribute("used_g"))}));
      let seconds = n(meta("prediction"));
      if (!fils.some(f => f.grams > 0) || !seconds){
        const g = await zipRead(z, `Metadata/plate_${idx}.gcode`, 400000);

      }
      const objs = [...pl.querySelectorAll("object")].filter(o => o.getAttribute("skipped") !== "true").map(o => o.getAttribute("name")||"");
      plates.push({index:idx, seconds, fils:fils.filter(f => f.grams > 0), objects:objs});

function resultFields(qty, cur){
  const res = cur ? (cur.goodQty>=cur.qty?"ok":cur.goodQty>0?"part":"fail") : "ok";
  return `<div class="seg" role="radiogroup" aria-label="Result">
    <label class="ok"><input type="radio" name="res" value="ok" ${res==="ok"?"checked":""}>Success<small>all units to stock</small></label>
    <label><input type="radio" name="res" value="part" ${res==="part"?"checked":""}>Partial<small>some units usable</small></label>
    <label class="ko"><input type="radio" name="res" value="fail" ${res==="fail"?"checked":""}>Failed<small>count as waste</small></label></div>
    <div class="form" style="margin-top:10px" data-resx>
      <label class="f" data-partf>Usable units<input id="r_goodq" type="number" min="0" value="${cur?cur.goodQty:Math.max(0,qty-1)}"></label>
      <label class="f" data-failf>What went wrong?<select id="r_reason">${REASONS.map(x=>`<option ${cur&&cur.failReason===x?"selected":""}>${x}</option>`).join("")}</select></label>
      ${cur ? "" : `<label class="f" data-progf>How far did it get? (%)<input id="r_prog" type="number" min="1" max="100" step="1" value="100"><span style="font-weight:400">Filament, time and cost are counted for this share only.</span></label>`}
    </div>`;
}
function syncResult(m){
  const v = m.querySelector('input[name="res"]:checked')?.value || "ok";
  m.querySelector("[data-partf]").hidden = v !== "part";
  m.querySelector("[data-failf]").hidden = v === "ok";
  m.querySelector("[data-resx]").hidden = v === "ok";
  const pf = m.querySelector("[data-progf]"); if (pf) pf.hidden = v !== "fail";
  const q = n(m.querySelector("#r_qty")?.value) || n(m.dataset.qty) || 1, gi = m.querySelector("#r_goodq");
  gi.max = q; if (n(gi.value) >= q) gi.value = Math.max(0, q-1);
}
function readResult(m, q){
  const v = m.querySelector('input[name="res"]:checked')?.value || "ok";
  const goodQty = v==="ok" ? q : v==="fail" ? 0 : Math.max(0, Math.min(q, Math.round(n(m.querySelector("#r_goodq").value))));
  const pi = m.querySelector("#r_prog"), progress = v==="fail" && pi ? Math.max(1, Math.min(100, Math.round(n(pi.value)||100))) : 100;
  return {goodQty, failReason: goodQty<q ? m.querySelector("#r_reason").value : "", progress};
}

  });
}
