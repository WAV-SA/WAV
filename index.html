/* Quick add follows the page you're on: one action runs straight away, several show just that page's options, and "More" opens everything. */
const QA = {
  print:["Log a print","deducts filament",()=>printForm()], sell:["Quick sale","takes from stock",()=>{ const ps = S.products.filter(p=>n(p.stock)>0); if (!ps.length) return toast("Nothing in stock to sell"); modal("Sell which product?", `<div class="sheet">${ps.map(p=>`<button data-sp="${p.id}">${esc(p.name)}<small>${esc(p.type)} · ${n(p.stock)} in stock</small></button>`).join("")}</div>`, mm => mm.querySelectorAll("[data-sp]").forEach(x => x.onclick = () => { close(); sellForm(product(x.dataset.sp)); })); }],
  order:["New order","for later delivery",()=>orderForm()], special:["Special order","custom work for a customer",()=>orderForm(null, {kind:"special"})],
  product:["New product","with cost recipe",()=>productForm()], spool:["New spool","filament",()=>spoolForm()],
  po:["Purchase order","filament or materials",()=>poForm()], supply:["New material","magnets, chips, boxes…",()=>supplyForm()],
  job:["Plan production","add to the queue",()=>jobForm()], calc:["How long would it take?","order calculator",()=>{ filter.pt = "calc"; go("plan"); }],
  maint:["Maintenance task","printer care",()=>maintForm()], expense:["New expense","purchase or running cost",()=>expenseForm()],
  idea:["New idea","note it down",()=>noteForm("ideas")], lesson:["New lesson","what you learned",()=>noteForm("lessons")]
};
const QA_PAGE = {home:["print","sell","order","job"], stock:["sell","print","job"], orders:["order","special","sell"], reports:["sell","order"], expenses:["expense"], plan:["job","calc"],
  printer:["maint","print"], products:["product"], prints:["print"], spools:["spool","po"], purchases:["po","supply"], notes:["idea","lesson"]};
const QA_ALL = ["print","sell","order","special","product","spool","po","supply","job","calc","maint","expense","idea","lesson"];
function quickSheet(keys, title, more){
  modal(title, `<div class="sheet">${keys.map(k => `<button data-q="${k}">${QA[k][0]}<small>${QA[k][1]}</small></button>`).join("")}${more ? `<button data-q="__all" class="ghost">More…<small>every shortcut</small></button>` : ""}</div>`,
    m => m.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { close(); if (b.dataset.q === "__all") return quickSheet(QA_ALL, "Quick add", false); QA[b.dataset.q][2](); }));
}
function syncFab(){ const f = $("#fab"), keys = QA_PAGE[view]; f.hidden = !keys || document.body.classList.contains("ro"); if (keys) f.setAttribute("aria-label", keys.length === 1 ? QA[keys[0]][0] : "Add"); }
$("#fab").onclick = () => { const keys = QA_PAGE[view] || QA_ALL; if (keys.length === 1) return QA[keys[0]][2](); quickSheet(keys, (VIEWS.find(v => v[0] === view)||[,"Quick add"])[1], true); };
const h = (location.hash||"").slice(1); if (VIEWS.some(v=>v[0]===h)) view = h;
if (/invite=/.test(location.hash)){
  const link = location.href;
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  setTimeout(() => { const inv = parseInvite(link); if (!inv) return toast("This invite link is incomplete."); if (syncOn() && !SY.readonly) return toast("This device is already connected with full access, so the invite was ignored."); useInvite(link); }, 50);
}
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.some(x=>x[0]===v) && v!==view){ view=v; render(); } });
boot();
let wantReload = false; // reload only after the person taps "Update now", never when a first install takes over the page
if ("serviceWorker" in navigator) window.addEventListener("load", async () => {
  try{
    const reg = await navigator.serviceWorker.register("sw.js");
    const offer = w => { if (!w || !navigator.serviceWorker.controller) return;
      $("#updRoot").innerHTML = `<div class="upd" role="status"><span>A new version of WAV is ready.</span><button class="btn sm primary" id="updBtn">Update now</button></div>`;
      $("#updBtn").onclick = () => { $("#updBtn").disabled = true; wantReload = true; w.postMessage("skip"); setTimeout(() => location.reload(), 2500); }; };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed") offer(w); }); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}); });
    let reloading = false; navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading || !wantReload) return; reloading = true; location.reload(); });
  }catch(e){}
});
})();
